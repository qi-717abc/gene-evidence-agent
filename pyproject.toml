[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-evidence-agent"
version = "0.1.0"
description = "A lightweight, source-grounded gene, disease, and drug evidence agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "tenacity>=9,<10",
    "python-dotenv>=1,<2",
    "pypdf>=5,<7",
    "tokenizers>=0.23.2,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
gene-evidence-agent = "gene_evidence_agent.cli:main"
gene-evidence-agent-web = "gene_evidence_agent.web_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gene_evidence_agent = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/education-guides/*.jpg",
    "web/education-guides/*.png",
    "knowledge/gene_cancer/*.json",
    "knowledge/gene_cancer/*.md",
    "education/*.json",
    "vendor/deepseek_v4_0e1a0e5/tokenizer.json",
    "vendor/deepseek_v4_0e1a0e5/LICENSE",
    "vendor/deepseek_v4_0e1a0e5/UPSTREAM.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

